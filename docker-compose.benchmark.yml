version: '3.7'
services:
  ala-php:
    build:
      context: ./
      dockerfile: ./ops/docker/dev-performance/php-fpm/Dockerfile 
    container_name: ala-php
    depends_on:
      ala-mysql:
        condition: service_healthy
    environment:
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
    volumes:
      - ./:/var/www/html

  ala-nginx:
    build:
      context: ./
      dockerfile: ./ops/docker/dev/nginx/Dockerfile
    container_name: ala-nginx
    depends_on:
      - ala-php
    ports:
      - 8101:80
    volumes:
      - ./:/var/www/html

  ala-mysql:
    image: mysql:8.0.28
    container_name: ala-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --bind-address=0.0.0.0
      - --max-connections=200
      - --innodb-buffer-pool-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --performance-schema=OFF
    ports:
      - 3306:3306
    environment:
      - MYSQL_DATABASE=ala
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - ./ops/mysql-db:/docker-entrypoint-initdb.d
      - ./storage/.db:/var/lib/mysql
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 30
